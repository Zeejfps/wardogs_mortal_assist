<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mortar Calculator</title>
  <meta name="description" content="Tiny mortar range calculator" />
  <meta name="theme-color" content="#14171c" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mortar" />
  <style>
    :root {
      --bg: #14171c;
      --panel: #1c2027;
      --panel-2: #232830;
      --border: #2d333d;
      --text: #e6e9ef;
      --muted: #8b93a1;
      --accent: #f5a623;
      --accent-dim: rgba(245, 166, 35, 0.15);
      --danger: #e5484d;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      user-select: none; overflow: hidden;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    body {
      display: flex; flex-direction: column;
      /* dvh follows the collapsing browser chrome on phones; the height: 100%
         above is the fallback for the Tauri webview. */
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .titlebar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .titlebar .title {
      flex: 1; font-weight: 600; font-size: 12px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
    }
    .titlebar button {
      background: transparent; border: 0; color: var(--muted);
      width: 24px; height: 22px; border-radius: 4px; cursor: pointer;
      font-size: 13px; line-height: 1;
    }
    /* Pin / minimise / close only mean something in the desktop shell. */
    body:not(.tauri) .win-only { display: none; }
    .titlebar button:hover { background: var(--panel-2); color: var(--text); }
    .titlebar button.close:hover { background: var(--danger); color: #fff; }
    .titlebar button.pin { display: inline-flex; align-items: center; justify-content: center; }
    .titlebar button.pin svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .titlebar button.pin .on { display: none; }
    .titlebar button.pin.active { color: var(--accent); background: var(--accent-dim); }
    .titlebar button.pin.active .on { display: block; }
    .titlebar button.pin.active .off { display: none; }

    main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; }

    section {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px;
    }
    section h2 {
      margin: 0 0 8px; font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; justify-content: space-between;
    }
    section h2 .tag {
      font-size: 10px; color: var(--accent); background: var(--accent-dim);
      padding: 1px 6px; border-radius: 999px; letter-spacing: 0.04em;
    }
    .row { display: flex; gap: 8px; }
    label { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    label span { font-size: 11px; color: var(--muted); }
    input {
      width: 100%; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 7px 9px; font-size: 15px; font-variant-numeric: tabular-nums;
      outline: none; transition: border-color 0.12s;
    }
    input:focus { border-color: var(--accent); }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    .result {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    }
    .result .label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .result .value {
      font-size: 44px; font-weight: 700; line-height: 1.1;
      color: var(--accent); font-variant-numeric: tabular-nums;
      margin: 4px 0 2px;
    }
    .result .value small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 4px; }
    .result .sub {
      display: flex; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .result .sub b { color: var(--text); font-weight: 600; }

    /* Install hint bar - hidden until the browser says installing is possible. */
    .install {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; font-size: 12px; line-height: 1.35;
      background: var(--accent-dim); border-top: 1px solid var(--border);
      color: var(--text);
    }
    /* An author display: flex beats the UA rule for [hidden], so restate it. */
    .install[hidden], .install button[hidden] { display: none; }
    .install p { margin: 0; flex: 1; }
    .install b { color: var(--accent); }
    .install button {
      flex: none; border: 0; border-radius: 6px; cursor: pointer;
      font: inherit; font-weight: 600; padding: 8px 12px;
      background: var(--accent); color: #14171c;
    }
    .install button.dismiss {
      background: transparent; color: var(--muted); padding: 8px; font-weight: 400;
    }

    /* Phones: bigger type, taller hit targets. Inputs must stay at 16px or
       larger or iOS Safari zooms the page in whenever a field is focused. */
    @media (pointer: coarse) {
      main { gap: 12px; padding: 14px; }
      section { padding: 12px; }
      section h2 { font-size: 12px; }
      label span { font-size: 12px; }
      input { font-size: 19px; padding: 12px; border-radius: 8px; }
      .result .value { font-size: 56px; }
      .result .value small { font-size: 20px; }
      .result .sub { font-size: 14px; gap: 18px; }
      .titlebar { padding: 12px 14px; }
      .titlebar .title { font-size: 13px; }
      .install { font-size: 13px; padding: 12px 14px; }
      .install button { padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <span class="title" data-tauri-drag-region>Mortar Calc</span>
    <button class="pin active win-only" id="pin" title="Pinned: always on top (click to unpin)">
      <!-- pinned: upright, filled -->
      <svg class="on" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z" fill="currentColor" stroke="none"/><path d="M12 14v7"/></svg>
      <!-- unpinned: tilted outline with a slash -->
      <svg class="off" viewBox="0 0 24 24"><g transform="rotate(40 12 12)"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/></g><path d="M4 4l16 16"/></svg>
    </button>
    <button class="win-only" id="min" title="Minimize">&#8211;</button>
    <button class="close win-only" id="close" title="Close">&#10005;</button>
  </div>

  <main>
    <section>
      <h2>Mortar <span class="tag">saved</span></h2>
      <div class="row">
        <label><span>X</span><input type="number" id="mx" step="any" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0" /></label>
        <label><span>Y</span><input type="number" id="my" step="any" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0" /></label>
      </div>
    </section>

    <section>
      <h2>Target</h2>
      <div class="row">
        <label><span>X1</span><input type="number" id="tx" step="any" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0" /></label>
        <label><span>Y1</span><input type="number" id="ty" step="any" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0" /></label>
      </div>
    </section>

    <section class="result">
      <div class="label">Distance</div>
      <div class="value"><span id="dist">0</span><small>m</small></div>
      <div class="sub">
        <span>ΔX <b id="dx">0</b></span>
        <span>ΔY <b id="dy">0</b></span>
        <span>Brg <b id="brg">0°</b></span>
      </div>
    </section>
  </main>

  <div class="install" id="install" hidden>
    <p id="installMsg"></p>
    <button id="installGo" hidden>Install</button>
    <button class="dismiss" id="installNo" title="Dismiss">&#10005;</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const inputs = ['mx', 'my', 'tx', 'ty'].map($);
    const SCALE = 100;

    function num(el) {
      const v = parseFloat(el.value);
      return Number.isFinite(v) ? v : 0;
    }

    function fmt(n, d = 0) {
      return n.toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
    }

    function update() {
      const dx = num($('tx')) - num($('mx'));
      const dy = num($('ty')) - num($('my'));
      const dist = Math.sqrt(dx * dx + dy * dy) * SCALE;
      // Bearing: 0° = +Y, clockwise. Adjust if the game uses a different convention.
      let brg = (Math.atan2(dx, dy) * 180) / Math.PI;
      if (brg < 0) brg += 360;

      $('dist').textContent = fmt(dist);
      $('dx').textContent = fmt(dx * SCALE);
      $('dy').textContent = fmt(dy * SCALE);
      $('brg').textContent = fmt(brg, 1) + '°';
    }

    // Persist all four fields so the mortar position survives restarts.
    function save() {
      try {
        localStorage.setItem('mortar', JSON.stringify(Object.fromEntries(inputs.map((i) => [i.id, i.value]))));
      } catch {}
    }
    function load() {
      try {
        const s = JSON.parse(localStorage.getItem('mortar') || '{}');
        inputs.forEach((i) => { if (s[i.id] != null) i.value = s[i.id]; });
      } catch {}
    }

    inputs.forEach((i) => {
      i.addEventListener('input', () => { update(); save(); });
      i.addEventListener('focus', () => i.select());
    });

    // Enter moves to the next field (mortar X -> Y -> target X1 -> Y1 -> back to X1).
    inputs.forEach((i, idx) => {
      i.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const next = idx === inputs.length - 1 ? inputs[2] : inputs[idx + 1];
          next.focus();
        }
      });
    });

    // Tauri window bridge (withGlobalTauri exposes window.__TAURI__). Absent
    // when the same files are served as a web app, so everything here is opt-in.
    if (window.__TAURI__) {
      document.body.classList.add('tauri');
      const tw = window.__TAURI__.window.getCurrentWindow();
      let pinned = true;

      $('min').onclick = () => tw.minimize();
      $('close').onclick = () => tw.close();
      const setPinUI = (on) => {
        $('pin').classList.toggle('active', on);
        $('pin').title = on ? 'Pinned: always on top (click to unpin)' : 'Unpinned: normal window (click to pin)';
      };
      $('pin').onclick = async () => {
        pinned = !pinned;
        await tw.setAlwaysOnTop(pinned);
        setPinUI(pinned);
      };
      // Some games grab the topmost slot when they gain focus; take it back on blur.
      tw.onFocusChanged(({ payload: focused }) => {
        if (!focused && pinned) tw.setAlwaysOnTop(true);
      });
      tw.isAlwaysOnTop().then((on) => { pinned = on; setPinUI(on); });
    }

    // --- Add to home screen --------------------------------------------------
    // Android/Chrome fires beforeinstallprompt and lets us trigger the real
    // dialog. iOS Safari has no such event and no prompt, so all we can do is
    // tell the user where the button is. Neither applies once it is installed.
    (function installBar() {
      if (window.__TAURI__) return;
      const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      if (installed || localStorage.getItem('mortar.installDismissed') === '1') return;

      const bar = $('install'), msg = $('installMsg'), go = $('installGo');
      const show = (html, withButton) => {
        msg.innerHTML = html;
        go.hidden = !withButton;
        bar.hidden = false;
      };
      const hide = (remember) => {
        bar.hidden = true;
        if (remember) { try { localStorage.setItem('mortar.installDismissed', '1'); } catch {} }
      };
      $('installNo').onclick = () => hide(true);

      let prompt = null;
      addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        prompt = e;
        show('Add to your home screen for offline use.', true);
      });
      addEventListener('appinstalled', () => hide(true));
      go.onclick = async () => {
        if (!prompt) return;
        hide(false);
        prompt.prompt();
        await prompt.userChoice;
        prompt = null;
      };

      // iPadOS 13+ reports itself as a Mac, hence the touch-point check.
      const ua = navigator.userAgent;
      const ios = /iPhone|iPod|iPad/.test(ua) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) return;
      // Only Safari can install on iOS; every other iOS browser is WebKit in a
      // wrapper with no Add to Home Screen.
      if (/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)) {
        show('Open this page in <b>Safari</b> to add it to your home screen.', false);
      } else {
        show('Tap <b>Share</b>, then <b>Add to Home Screen</b>.', false);
      }
    })();

    // Offline install. Service workers need a secure context, so this is a
    // no-op under tauri://, file:// and plain http on a LAN address.
    if ('serviceWorker' in navigator &&
        (location.protocol === 'https:' || location.hostname === 'localhost')) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }

    load();
    update();
    $('tx').focus();
  </script>
</body>
</html>
