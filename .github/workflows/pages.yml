# Builds the app and publishes dist/ to GitHub Pages when a release tag is pushed:
#
#     git tag v1.0.1 && git push origin v1.0.1
#
# public/CNAME carries the custom domain; Vite copies public/ into dist/ so it
# ends up in the uploaded artifact.
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Every built file carries a content hash and the service worker's
      # precache list is regenerated from them, so an installed phone picks up
      # a new deploy on its next launch without any manual cache versioning.
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
