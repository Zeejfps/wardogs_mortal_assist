# Publishes src/ to GitHub Pages when a release tag is pushed:
#
#     git tag v1.0.1 && git push origin v1.0.1
#
# There is no build step - the folder is the site. src/CNAME carries the custom
# domain, so it has to be part of the uploaded artifact (it is, it lives in src/).
name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp the tag into the service worker cache name. Installed phones only
      # drop their old copy when this string changes, so tying it to the release
      # means every deploy invalidates automatically.
      - name: Version the service worker cache
        run: |
          version="${GITHUB_REF_NAME:-manual-$GITHUB_SHA}"
          sed -i "s/const CACHE = '[^']*'/const CACHE = 'mortar-$version'/" src/sw.js
          grep -n "const CACHE" src/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deploy
        uses: actions/deploy-pages@v4
