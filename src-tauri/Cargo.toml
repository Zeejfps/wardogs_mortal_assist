[package]
name = "mortar-calculator"
version = "1.0.0"
description = "Tiny always-on-top mortar range calculator"
authors = ["Zee Vasilyev"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }

[[bin]]
name = "MortarCalculator"
path = "src/main.rs"
